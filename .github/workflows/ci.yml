name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit and integration tests in each preset (SR-03 ASan/UBSan, SR-04 TSan, RR-11).
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libopencv-dev libgtest-dev nlohmann-json3-dev libcli11-dev libyaml-cpp-dev clang-format \
            python3-pytest python3-pandas python3-matplotlib

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # One short real run per policy through the CLI; each must exit 0 and write a valid
      # summary.json. `setarch -R` is needed by the tsan binary and harmless for the others.
      - name: Smoke runs
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/tsan.supp
        run: |
          mkdir -p smoke  # --out's parent must exist (VR-17)
          for policy in blocking drop-oldest drop-newest adaptive; do
            setarch -R ./build/${{ matrix.preset }}/frameflow run --source=synthetic \
              --duration=3 --warmup=1 --cost-ms=50 --policy=$policy --out=smoke/$policy
            python3 -c "import json,sys; s=json.load(open('smoke/$policy/summary.json')); sys.exit(0 if s['valid'] and s['metrics']['produced'] > 0 else 1)"
          done

  # SR-11 / RR-07: clang-format and clang-tidy (bugprone-*, cert-*, concurrency-*) report zero
  # problems on the product code (P5.7, D54).
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libopencv-dev libgtest-dev nlohmann-json3-dev libcli11-dev libyaml-cpp-dev \
            clang-format clang-tidy

      - name: Configure (compile_commands.json)
        run: cmake --preset debug

      - name: clang-format and clang-tidy
        run: scripts/check_tidy.sh build/debug

  # RR-09: line coverage of the queue, policy and stats modules is at least 85% (P5.8, D55).
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libopencv-dev libgtest-dev nlohmann-json3-dev libcli11-dev libyaml-cpp-dev \
            python3-pytest python3-pandas python3-matplotlib

      - name: Build and test with gcov
        run: |
          cmake --preset coverage
          cmake --build --preset coverage --parallel
          ctest --preset coverage

      - name: Coverage of queue, policy and stats
        run: python3 scripts/coverage.py build/coverage --min 85

  # Long and stress tests (60 s gate run, 200 lifecycle cycles, 60 s policy stress), kept out of the default
  # presets (D10). The tsan preset runs tests under `setarch -R` (see docs/DESIGN.md).
  long-and-stress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - configure: debug
            test: debug-long
          - configure: tsan
            test: tsan-long
    steps:
      - uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libopencv-dev libgtest-dev nlohmann-json3-dev libcli11-dev libyaml-cpp-dev

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.configure }} --parallel

      - name: Long and stress tests
        run: ctest --preset ${{ matrix.test }}
