# E6 Real processing load (SPEC 11): E3's bursty load on top of real OpenCV processing.
# Gaussian blur (kernel 15) and Canny at 720p and 1080p, all four policies; 60 s; 5 repeats.
# Scope (D53): the E3 part of "repeat E2 and E3"; adding E2's three overload levels would make
# 48 configurations (about 4 h). Processing runs on the worker thread only (D50).
experiment: e6_real_load
source: { type: synthetic, fps: 30 }
processor: { kernel: 15 }
duration_s: 60
warmup_s: 3
repeats: 5
seed: 42
queue: 8
cost_mode: bursty
cost_ms: 20
spike_ms: 80
spike_len: 1s
spike_every: 5s
matrix:
  processor.type: [blur, canny]
  source.resolution: [1280x720, 1920x1080]
  policy: [blocking, drop-oldest, drop-newest, adaptive]
adaptive: { target_ms: 100, exit_ratio: 0.7, window: 30 }
